name: Windows desktop installer

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install project dependencies
        run: npm install --no-audit --no-fund

      - name: Run research engine tests
        run: npx tsx server/__tests__/research_engine.test.ts

      - name: Build and package Windows app
        run: npm run desktop:dist

      - name: Smoke test packaged desktop app
        shell: pwsh
        run: ./scripts/windows-smoke-test.ps1

      - name: Report installer size
        shell: pwsh
        run: |
          Get-ChildItem release/*.exe | ForEach-Object {
            [PSCustomObject]@{
              Installer = $_.Name
              SizeMB = [math]::Round($_.Length / 1MB, 2)
            }
          } | Format-Table -AutoSize

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: AS-Radar-X-Windows-Installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30
